[project]
name = "advent_of_code"
version = "0.1.0"
description = ""
authors = [{ name = "cdar", email = "cdar07@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
    "tqdm>=4.66.1,<5",
    "pygame>=2.5.2,<3",
    "psutil>=5.9.7,<6",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "black>=23.11.0,<24",
    "pytest-mock>=3.12.0,<4",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
